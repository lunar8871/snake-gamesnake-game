<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snake Game with Sound & Rankings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #scoreBoard {
      color: white;
      font-size: 20px;
      padding: 10px;
    }
    #startBtn {
      padding: 10px 20px;
      font-size: 16px;
      margin-bottom: 10px;
    }
    #rankings {
      color: #ccc;
      font-size: 16px;
      margin-top: 10px;
      text-align: center;
    }
    canvas {
      background: #000;
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>

<div id="scoreBoard">Score: 0 | High Score: 0</div>
<button id="startBtn">Start Game</button>
<canvas id="gameCanvas"></canvas>
<div id="rankings"></div>

<audio id="bgm" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7cb2c6d609.mp3?filename=8-bit-arcade-115111.mp3" type="audio/mp3" />
</audio>
<audio id="eatSound">
  <source src="https://cdn.pixabay.com/download/audio/2022/02/23/audio_37cf34e3cb.mp3?filename=arcade-notification-111879.mp3" type="audio/mp3" />
</audio>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreBoard = document.getElementById('scoreBoard');
  const startBtn = document.getElementById('startBtn');
  const bgm = document.getElementById('bgm');
  const eatSound = document.getElementById('eatSound');
  const rankingsEl = document.getElementById('rankings');

  const box = 20;
  let cols, rows;
  let snake, food, direction, score, highScore, speed, game, obstacles;

  function resizeCanvas() {
    canvas.width = Math.floor(window.innerWidth / box) * box;
    canvas.height = Math.floor((window.innerHeight - 120) / box) * box;
    cols = canvas.width / box;
    rows = canvas.height / box;
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function randomPosition() {
    return {
      x: Math.floor(Math.random() * cols) * box,
      y: Math.floor(Math.random() * rows) * box
    };
  }

  function generateObstacles(n = 5) {
    let obs = [];
    while (obs.length < n) {
      let pos = randomPosition();
      if (!snake.some(s => s.x === pos.x && s.y === pos.y) &&
          !(food && food.x === pos.x && food.y === pos.y)) {
        obs.push(pos);
      }
    }
    return obs;
  }

  function updateScore() {
    highScore = Math.max(score, highScore);
    localStorage.setItem('highScore', highScore);
    scoreBoard.textContent = `Score: ${score} | High Score: ${highScore}`;
  }

  function saveRanking(score) {
    let rankings = JSON.parse(localStorage.getItem('rankings') || '[]');
    rankings.push({ score, date: new Date().toLocaleString() });
    rankings.sort((a, b) => b.score - a.score);
    rankings = rankings.slice(0, 5); // 상위 5명만 저장
    localStorage.setItem('rankings', JSON.stringify(rankings));
  }

  function showRankings() {
    const rankings = JSON.parse(localStorage.getItem('rankings') || '[]');
    if (rankings.length === 0) return;
    let html = '<strong>Top 5 Rankings</strong><br>';
    rankings.forEach((r, i) => {
      html += `${i + 1}. ${r.score} pts (${r.date})<br>`;
    });
    rankingsEl.innerHTML = html;
  }

  function startGame() {
    snake = [{ x: Math.floor(cols / 2) * box, y: Math.floor(rows / 2) * box }];
    direction = 'RIGHT';
    food = randomPosition();
    score = 0;
    speed = 130;
    highScore = parseInt(localStorage.getItem('highScore')) || 0;
    obstacles = generateObstacles();
    updateScore();
    rankingsEl.innerHTML = '';
    if (game) clearInterval(game);
    game = setInterval(draw, speed);
    bgm.play();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? 'limegreen' : 'dodgerblue';
      ctx.fillRect(seg.x, seg.y, box, box);
      ctx.strokeStyle = 'white';
      ctx.strokeRect(seg.x, seg.y, box, box);
    });

    ctx.fillStyle = 'red';
    ctx.fillRect(food.x, food.y, box, box);

    ctx.fillStyle = 'gray';
    obstacles.forEach(o => ctx.fillRect(o.x, o.y, box, box));

    let headX = snake[0].x;
    let headY = snake[0].y;

    if (direction === 'LEFT') headX -= box;
    else if (direction === 'UP') headY -= box;
    else if (direction === 'RIGHT') headX += box;
    else if (direction === 'DOWN') headY += box;

    if (
      headX < 0 || headX >= canvas.width ||
      headY < 0 || headY >= canvas.height ||
      snake.some(s => s.x === headX && s.y === headY) ||
      obstacles.some(o => o.x === headX && o.y === headY)
    ) {
      clearInterval(game);
      alert(`Game Over!\nScore: ${score}`);
      saveRanking(score);
      showRankings();
      return;
    }

    if (headX === food.x && headY === food.y) {
      score++;
      updateScore();
      eatSound.currentTime = 0;
      eatSound.play();
      food = randomPosition();
      clearInterval(game);
      speed = Math.max(50, speed - 5);
      game = setInterval(draw, speed);
    } else {
      snake.pop();
    }

    snake.unshift({ x: headX, y: headY });
  }

  function handleDirection(e) {
    if (e.key === 'ArrowLeft' && direction !== 'RIGHT') direction = 'LEFT';
    else if (e.key === 'ArrowUp' && direction !== 'DOWN') direction = 'UP';
    else if (e.key === 'ArrowRight' && direction !== 'LEFT') direction = 'RIGHT';
    else if (e.key === 'ArrowDown' && direction !== 'UP') direction = 'DOWN';
  }

  // Mobile swipe
  let startX, startY;
  canvas.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  });

  canvas.addEventListener('touchmove', e => {
    if (!startX || !startY) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0 && direction !== 'LEFT') direction = 'RIGHT';
      else if (dx < 0 && direction !== 'RIGHT') direction = 'LEFT';
    } else {
      if (dy > 0 && direction !== 'UP') direction = 'DOWN';
      else if (dy < 0 && direction !== 'DOWN') direction = 'UP';
    }
    startX = startY = null;
  });

  document.addEventListener('keydown', handleDirection);
  startBtn.addEventListener('click', startGame);
</script>

</body>
</html>

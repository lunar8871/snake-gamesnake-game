<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ultimate Snake Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #scoreBoard {
      color: white;
      font-size: 20px;
      padding: 10px;
    }
    #controls {
      display: flex;
      flex-direction: row;
      gap: 10px;
      margin-bottom: 10px;
    }
    select, button {
      padding: 10px 20px;
      font-size: 16px;
    }
    #rankings {
      color: #ccc;
      font-size: 16px;
      margin-top: 10px;
      text-align: center;
    }
    canvas {
      background: #000;
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>

<div id="scoreBoard">Score: 0 | High Score: 0</div>
<div id="controls">
  <select id="skinSelect">
    <option value="classic">Classic (Green / Blue)</option>
    <option value="neon">Neon (Cyan / Magenta)</option>
    <option value="rainbow">Rainbow (Random Colors)</option>
  </select>
  <button id="startBtn">Start Game</button>
</div>
<canvas id="gameCanvas"></canvas>

<div>
  <input id="playerName" placeholder="Enter your name" style="margin-top:10px; padding:5px; font-size:16px;">
  <button onclick="submitMyScore()">Submit Score</button>
</div>

<div id="rankings"><strong>Top 10 Leaderboard</strong><br><ul id="rankingList"></ul></div>

<audio id="bgm" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7cb2c6d609.mp3?filename=8-bit-arcade-115111.mp3" type="audio/mp3" />
</audio>
<audio id="eatSound">
  <source src="https://cdn.pixabay.com/download/audio/2022/02/23/audio_37cf34e3cb.mp3?filename=arcade-notification-111879.mp3" type="audio/mp3" />
</audio>

<script>
const SUPABASE_URL = 'https://kfbweiwwygckkpeomczo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmYndlaXd3eWdja2twZW9tY3pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU5ODQzNDIsImV4cCI6MjA2MTU2MDM0Mn0.tmp1MpHD1PxXV4cGdG0Hlin7hn81SxsOFRIoknEr1JE';

async function submitScore(name, score) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/scores`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({ name, score })
    });
  } catch (err) {
    console.error('Submit error:', err);
  }
}

async function loadRanking() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=name,score&order=score.desc&limit=10`, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    return await res.json();
  } catch (err) {
    console.error('Load error:', err);
    return [];
  }
}

function submitMyScore() {
  const name = document.getElementById('playerName').value || 'Anonymous';
  submitScore(name, score).then(loadAndShowRanking);
}

function loadAndShowRanking() {
  loadRanking().then(scores => {
    const list = document.getElementById('rankingList');
    if (Array.isArray(scores)) {
      list.innerHTML = scores.map(s => `<li>${s.name}: ${s.score} pts</li>`).join('');
    } else {
      list.innerHTML = '⚠️ Failed to load leaderboard';
    }
  });
}

document.addEventListener('DOMContentLoaded', loadAndShowRanking);
</script>

<script>
// 자동 점수 제출 포함된 스네이크 게임 코드 시작

// ...기존 코드 유지됨...

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (directionQueue.length > 0) {
    direction = directionQueue.shift();
  }

  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? headColor : bodyColor;
    ctx.fillRect(seg.x, seg.y, box, box);
    ctx.strokeStyle = 'white';
    ctx.strokeRect(seg.x, seg.y, box, box);
  });

  ctx.fillStyle = 'red';
  ctx.fillRect(food.x, food.y, box, box);

  ctx.fillStyle = 'gray';
  obstacles.forEach(o => ctx.fillRect(o.x, o.y, box, box));

  let headX = snake[0].x;
  let headY = snake[0].y;

  if (direction === 'LEFT') headX -= box;
  else if (direction === 'UP') headY -= box;
  else if (direction === 'RIGHT') headX += box;
  else if (direction === 'DOWN') headY += box;

  if (
    headX < 0 || headX >= canvas.width ||
    headY < 0 || headY >= canvas.height ||
    snake.some(s => s.x === headX && s.y === headY) ||
    obstacles.some(o => o.x === headX && o.y === headY)
  ) {
    clearInterval(game);
    alert(`Game Over!
Score: ${score}`);
    saveRanking(score);
    showRankings();
    if (score > 0) submitMyScore(); // ✅ 자동 제출 (0점일 때는 무시)
    return;
  }

  if (headX === food.x && headY === food.y) {
    score++;
    updateScore();
    eatSound.pause();
    eatSound.currentTime = 0;
    eatSound.play().catch(e => console.log("Sound error:", e));
    food = randomPosition();
    clearInterval(game);
    speed = Math.max(50, speed - 5);
    game = setInterval(draw, speed);
  } else {
    snake.pop();
  }

  snake.unshift({ x: headX, y: headY });
}

// 기존 코드 유지됨
</script>
</body>
</html>
